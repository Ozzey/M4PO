# All 200 official MMBench training tasks, online RL FROM SCRATCH.
# This does not include NEWT's expert-demonstration pretraining or architecture.
# Compare against a from-scratch baseline; the full budget is intentionally large.
env: mmbench
mmbench_task_set: soup
mmbench_sampling: fixed
task: soup
use_images: false
proprio_dim: 0
state_dim: 128
task_context_mode: frozen
task_context_dim: 512
mmbench_eval_num_envs: 1
seed: 0
num_envs: 200
max_episode_steps: 1000
learning_mode: off_policy
total_steps: 100000000
seed_steps: 200000
pretrain_updates: 1000
updates_per_step: 0.075
replay_capacity: 10000000
batch_size: 1024
num_q: 5
rho: 0.5
rollout_steps: 128
eval_every: 2000000
eval_at_start: true
eval_episodes: 2
save_every: 1000000
log_every: 10000
log_dir: runs/mmbench_all_seed0
save_replay: true
model_horizon: 3
planning_horizon: 5
task_latent_dim: 256
body_latent_dim: 256
embodiment_context_dim: 32
encoder_dim: 768
mlp_dim: 768
simnorm_dim: 8
planner_samples: 64
world_model_lr: 0.0003
actor_lr: 0.0003
critic_lr: 0.0003
entropy_coef: 0.0001
discrepancy_beta: 0.0
policy_optimization_enabled: false
policy_optimization_weight: 0.0
exploration_bonus_enabled: false
exploration_bonus_weight: 0.0
device: cuda
matmul_precision: high
