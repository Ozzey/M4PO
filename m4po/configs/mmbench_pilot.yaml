# Four authentic MMBench tasks, trained jointly from scratch.
# A pipeline/throughput pilot, NOT the full 200-task NEWT comparison.
env: mmbench
mmbench_task_set: dmcontrol
task: cartpole-balance
tasks: cartpole-balance,cartpole-swingup,reacher-easy,walker-stand
multitask: true
num_tasks: 4
use_images: false
proprio_dim: 0
state_dim: 128
task_context_mode: frozen
task_context_dim: 512
mmbench_eval_num_envs: 1
seed: 0
num_envs: 4
max_episode_steps: 500
learning_mode: off_policy
total_steps: 40000
seed_steps: 4000
pretrain_updates: 200
updates_per_step: 0.25
replay_capacity: 200000
batch_size: 128
num_q: 5
rho: 0.5
rollout_steps: 128
eval_every: 0
save_every: 10000
log_every: 1000
log_dir: runs/mmbench_pilot_seed0
model_horizon: 3
planning_horizon: 5
task_latent_dim: 64
body_latent_dim: 64
embodiment_context_dim: 32
encoder_dim: 128
mlp_dim: 256
simnorm_dim: 8
planner_samples: 64
world_model_lr: 0.0003
actor_lr: 0.0003
critic_lr: 0.0003
entropy_coef: 0.0001
discrepancy_beta: 0.0
policy_optimization_enabled: false
policy_optimization_weight: 0.0
exploration_bonus_enabled: false
exploration_bonus_weight: 0.0
device: cuda
